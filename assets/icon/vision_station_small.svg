<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Vision Station at 16-24 px: the lens alone, thicker, so it stays a
       lens and not a smudge. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C95FF"/>
      <stop offset="0.55" stop-color="#0A59F7"/>
      <stop offset="1" stop-color="#003CC0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg)"/>
  <circle cx="16" cy="16" r="7.6" fill="none" stroke="#FFFFFF" stroke-width="2.9"/>
  <circle cx="16" cy="16" r="3.1" fill="#FFFFFF"/>
</svg>
