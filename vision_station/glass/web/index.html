<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Glass</title>
<link rel="stylesheet" href="/web/glass.css">
</head>
<body>
<!-- Liquid glass: the backdrop is bent at the edges like a lens (an SVG
     displacement map), blurred and brightened, then lit along the rim. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="lg-strong" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="lg-soft" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.006" numOctaves="1" seed="3" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="3" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="wallpaper" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div id="app">
  <aside id="sidebar" class="glass panel">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">Vision Glass</div>
        <div class="brand-sub" id="appName">—</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-title">Inspections</div>
    <div id="jobList"></div>
    <div class="grow"></div>
    <button class="glass-btn ghost wide" id="openApp"></button>
  </aside>

  <main id="main">
    <header id="toolbar" class="glass capsule">
      <div id="viewTitle" class="view-title">Run</div>
      <div class="grow"></div>
      <div id="kpis"></div>
      <div class="sep"></div>
      <label class="switch-label"><span>Continuous</span><span class="switch" id="contSwitch"></span></label>
      <button class="glass-btn prominent" id="runBtn"></button>
      <button class="glass-btn icon" id="settingsBtn" title="Settings"></button>
      <button class="glass-btn icon" id="themeBtn" title="Light / dark"></button>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="toasts"></div>
<div id="layer"></div>
<script src="/web/icons.js"></script>
<script src="/web/glass.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
