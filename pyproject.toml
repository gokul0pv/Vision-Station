[project]
name = "vision-station"
version = "2.0.0"
description = "Desktop machine-vision inspection: build inspections, run them on a camera, export them to a line PC."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Gokul PV" }]
requires-python = ">=3.10"
# The full, pinned list (with the GPU runtime choice) is requirements.txt;
# scripts/install.py installs it.
dependencies = [
    "PySide6>=6.6",
    "opencv-contrib-python==4.10.0.84",
    "numpy>=1.24,<2.2",
]

[project.scripts]
vision-station = "vision_station.__main__:main"

[tool.setuptools.packages.find]
include = ["vision_station*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the package, the helper scripts the tests use, and the fake camera
pythonpath = [".", "scripts", "tests"]
addopts = "-p no:cacheprovider"
